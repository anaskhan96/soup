name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -show verbose ./...
